<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060b15;--surface:#0b1222;--card:#101828;--card-hi:#141f32;
  --border:#1a2840;--border-hi:#253855;
  --accent:#4272ff;--accent2:#9456ff;
  --accent-soft:rgba(66,114,255,.11);--accent-glow:rgba(66,114,255,.28);
  --grad:linear-gradient(135deg,#4272ff 0%,#9456ff 100%);
  --text:#d8e5ff;--text-sub:#7d92ba;--text-faint:#1d2e4a;
  --success:#00d18a;--success-soft:rgba(0,209,138,.11);
  --warning:#ffb340;--warning-soft:rgba(255,179,64,.11);
  --danger:#ff4f5e;--danger-soft:rgba(255,79,94,.11);
  --info:#38c3ff;--info-soft:rgba(56,195,255,.11);
  --purple:#9456ff;--purple-soft:rgba(148,86,255,.11);
  --sidebar-w:228px;--rx:14px;--rx-sm:9px;--rx-xs:6px;
  --ease:cubic-bezier(.4,0,.2,1);
}
[data-theme="light"]{
  --bg:#eef2fa;--surface:#f8faff;--card:#ffffff;--card-hi:#f2f5ff;
  --border:#d9e2f4;--border-hi:#bfcef0;
  --accent:#3360f5;--accent2:#7c3df0;
  --accent-soft:rgba(51,96,245,.09);--accent-glow:rgba(51,96,245,.2);
  --grad:linear-gradient(135deg,#3360f5 0%,#7c3df0 100%);
  --text:#0c1631;--text-sub:#6377a0;--text-faint:#c8d3ea;
  --success:#009960;--success-soft:rgba(0,153,96,.09);
  --warning:#cc8800;--warning-soft:rgba(204,136,0,.09);
  --danger:#d42030;--danger-soft:rgba(212,32,48,.09);
  --info:#0090cc;--info-soft:rgba(0,144,204,.09);
  --purple:#6a2fd4;--purple-soft:rgba(106,47,212,.09);
}
html{scroll-behavior:smooth}
body{font-family:'Figtree',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden}
html{scrollbar-gutter:stable}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-hi);background:color-mix(in srgb,var(--text-sub) 45%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box;min-height:52px}
::-webkit-scrollbar-thumb:hover{background:var(--text-sub);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:auto;scrollbar-color:var(--border-hi) transparent}}
::selection{background:var(--accent-soft);color:var(--accent)}
.hidden{display:none!important}
#layout{display:flex;min-height:100vh;max-width:100vw;overflow-x:clip}
#sidebar{width:var(--sidebar-w);flex-shrink:0;position:fixed;top:0;left:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:60;transition:background .3s,border-color .3s}
.sb-logo{padding:26px 20px 20px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
.sb-icon{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:800;color:#fff}
.sb-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--rx-sm);cursor:pointer;transition:all .16s var(--ease);font-size:.875rem;font-weight:500;color:var(--text-sub);border:1px solid transparent;user-select:none}
.ni:hover{background:var(--accent-soft);color:var(--text)}
.ni.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ni svg{width:17px;height:17px;stroke:var(--text-sub);stroke-width:1.8;fill:none;transition:stroke .16s;flex-shrink:0}
.ni:hover svg,.ni.on svg{stroke:var(--accent)}
.ni-lbl{flex:1}
.nc{background:var(--accent-soft);color:var(--accent);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:10px}
.save-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--rx-sm);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.save-row:hover{border-color:var(--border-hi)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.save-info{flex:1;min-width:0}
#content{margin-left:var(--sidebar-w);flex:1;min-height:100vh;min-width:0;max-width:100%;box-sizing:border-box}
.pg{padding:36px 40px 80px;animation:pgIn .22s var(--ease) both;min-width:0;box-sizing:border-box;width:100%}
@keyframes pgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:.71rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-sub);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:18px;height:2px;background:var(--grad);border-radius:1px}
.ptitle{font-family:'Syne',sans-serif;font-size:2rem;font-weight:700;line-height:1.1;letter-spacing:-.025em}
#vw-client-detail{max-width:1400px;margin-left:auto;margin-right:auto}
.cl-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 32px;align-items:stretch;min-width:0}
.cl-cols>.pb{min-width:0}
.cl-cols{grid-template-columns:minmax(0,1fr)}
.bcrumb{font-size:.8rem;color:var(--text-sub);margin-top:4px;display:flex;align-items:center;gap:5px}
.bcrumb a{color:var(--accent);cursor:pointer}
.h-hero{text-align:center;padding:6px 0 10px}
.h-date{font-size:.95rem;font-weight:500;letter-spacing:.02em;color:var(--text-sub);margin-bottom:2px}
.h-clock{font-family:'Figtree',sans-serif;font-size:3.5rem;line-height:1;letter-spacing:-.04em;font-weight:300;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;user-select:none}
.h-greet{font-family:'Figtree',sans-serif;font-size:.9rem;font-weight:400;color:var(--text);margin-top:2px}
.h-greet em{font-style:normal;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:20px 22px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.sc:hover{border-color:var(--border-hi);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.22)}
.sc::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .22s var(--ease)}
.sc:hover::after{transform:scaleX(1)}
.sc-lbl{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-sub);margin-bottom:8px}
.sc-val{font-family:'Figtree',sans-serif;font-size:2.4rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.sc-sub{font-size:.77rem;color:var(--text-sub);margin-top:6px}
.sc-sub strong{color:var(--warning);font-weight:600}
.pb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.home-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.home-row2{grid-template-columns:1fr}
.home-stats-head{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.home-stats-sub{font-size:.78rem;font-weight:500;color:var(--text-sub);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 12px}
.home-stats-sub:first-of-type{margin-top:0}
.home-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:8px}
.home-cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.sbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:.8rem}
.sbar-row:last-child{margin-bottom:0}
.sbar-lbl{width:108px;flex-shrink:0;color:var(--text-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;min-width:0}
.sbar-fill{height:100%;border-radius:4px}
.sbar-val{width:30px;text-align:right;font-weight:700;color:var(--text);flex-shrink:0}
.sbar-list{display:grid;grid-template-columns:fit-content(55%) minmax(30px,1fr) auto;gap:9px 10px;align-items:center}
.sbar-list .sbar-row{display:contents}
.sbar-list .sbar-lbl{width:auto;min-width:0}
.sbar-list .sbar-val{width:auto;min-width:24px}
.sbar-multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:9px 34px}
.sbar-multi .sbar-row{margin-bottom:0}
.sbar-multi .sbar-lbl{width:175px}
.sbar-multi .sbar-track{max-width:200px}
.sbar-multi .sbar-row[data-zero]{opacity:.45}
.pb{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);overflow:hidden;transition:border-color .18s}
.pb:hover{border-color:var(--border-hi)}
.pb-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 12px;border-bottom:1px solid var(--border)}
.pb-title{font-family:'Syne',sans-serif;font-size:.875rem;font-weight:600;display:flex;align-items:center;gap:8px}
.pb-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.ico-b{background:var(--accent-soft)}.ico-g{background:var(--success-soft)}.ico-p{background:var(--purple-soft)}
.pb-body{padding:6px 6px 4px}
.pi{padding:9px 10px;border-radius:var(--rx-sm);cursor:pointer;transition:background .14s}
.pi:hover{background:var(--card-hi)}
.pi-cl{display:flex;align-items:center;gap:10px}
.pi-n{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.pi-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.73rem;color:var(--text-sub)}
.pb-foot{padding:10px 12px;border-top:1px solid var(--border)}
.p-empty{padding:20px 12px;text-align:center;color:var(--text-sub);font-size:.8rem;font-style:italic}
.frow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.ftabs{display:flex;gap:5px;flex-wrap:wrap}
.ftab{padding:6px 14px;border-radius:20px;font-size:.77rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-sub);font-family:'Figtree',sans-serif;transition:all .14s}
.ftab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.ctr-tab-add{font-weight:700;padding:6px 12px}
.ftab:hover:not(.on){background:var(--card);color:var(--text)}
.ir{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .14s,background .14s,transform .14s;position:relative;overflow:hidden;min-width:0;width:100%;box-sizing:border-box}
.ir::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .14s}
.ir:hover{border-color:var(--border-hi);background:var(--card-hi);transform:translateX(2px)}
.ir:hover::before{opacity:1}
.ir.s-relancer::before,.ir.s-relancer:hover::before{background:var(--warning);opacity:1}
.ir.s-acceptee::before,.ir.s-acceptee:hover::before{background:var(--success);opacity:1}
.ir.s-refusee::before,.ir.s-refusee:hover::before{background:var(--danger);opacity:.7}
.ir.done{opacity:.55}
.ir.done .ir-n{text-decoration:line-through}
.ir-main{flex:1;min-width:0}
.ir-n{font-size:.9rem;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir-m{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden;font-size:.75rem;color:var(--text-sub)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;flex-shrink:0;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.bd{background:var(--danger-soft);color:var(--danger)}.bd::before{background:var(--danger)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:.7rem;color:var(--text-sub);background:var(--border);border:1px solid var(--border-hi);white-space:nowrap;flex-shrink:0}
.cp-forte,.cp-moyenne,.cp-faible{background:none;border:none;padding:0;font-weight:700}
.cp-forte{color:#FF9480}
.cp-moyenne{color:#7D9AFF}
.cp-faible{color:var(--text-sub)}
.cp-forte::before,.cp-moyenne::before,.cp-faible::before{display:none}
.prio-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:16px}
.prio-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.pp{padding:11px 6px;border-radius:var(--rx-sm);border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .15s;font-size:.78rem;font-weight:700;color:var(--text-sub)}
.pp:hover{border-color:var(--border-hi)}
.pp.pf{border-color:#FF9480;background:rgba(255,148,128,.15);color:#FF9480}
.pp.pm{border-color:#7D9AFF;background:rgba(125,154,255,.15);color:#7D9AFF}
.pp.pl{border-color:var(--border-hi);background:var(--card-hi);color:var(--text)}
.pp.t-forte{color:#FF9480}
.pp.t-moyenne{color:#7D9AFF}
.pp.t-faible{color:var(--text-sub)}
.nt-list{display:flex;flex-direction:column;gap:8px}
.nt-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--rx-sm)}
.nt-tag{font-size:.64rem;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.nt-main{flex:1;min-width:0}
.nt-cl{font-weight:700;font-size:.86rem;cursor:pointer;color:var(--text)}
.nt-cl:hover{color:var(--accent)}
.nt-txt{font-size:.82rem;color:var(--text-sub);margin-top:2px}
.tag.tag-alert{background:rgba(255,107,122,.15);color:#ff8f9a;border-color:rgba(255,107,122,.32);font-weight:700}
.tag.tag-saas,.group-tag.tag-saas{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.group-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600;background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple-soft);white-space:nowrap;flex-shrink:0}
.bt-forte{background:rgba(255,148,128,.15);color:#FF9480}
.bt-moyenne{background:rgba(125,154,255,.15);color:#7D9AFF}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--rx-sm);font-family:'Figtree',sans-serif;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:all .17s var(--ease);white-space:nowrap}
.btn-p{background:var(--grad);color:#fff;border:1px solid transparent;box-shadow:0 4px 16px var(--accent-glow)}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-s{background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.btn-s:hover{border-color:var(--accent)}
.btn-g{background:transparent;color:var(--text-sub);border:1px solid var(--border)}
.btn-g:hover{background:var(--card);color:var(--text);border-color:var(--border-hi)}
.btn-d{background:var(--danger-soft);color:var(--danger);border:1px solid transparent}
.btn-d:hover{background:var(--danger);color:#fff}
.btn-sm{padding:7px 15px;font-size:.8rem}
.btn-xs{padding:4px 10px;font-size:.75rem}
.ibt{width:31px;height:31px;border-radius:var(--rx-xs);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-sub);transition:all .14s;font-size:.88rem;font-family:'Figtree',sans-serif}
.ibt:hover{background:var(--card-hi);color:var(--text);border-color:var(--border-hi)}
.ibt.del:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-soft)}
#mo{position:fixed;inset:0;z-index:200;background:rgba(4,8,18,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:mf .18s ease}
@keyframes mf{from{opacity:0}to{opacity:1}}
#mb{background:var(--surface);border:1px solid var(--border-hi);border-radius:20px;width:100%;max-width:580px;max-height:88vh;overflow-y:auto;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.5);animation:ms .22s var(--ease)}
@keyframes ms{from{transform:scale(.96) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.mt{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700}
.mc{width:33px;height:33px;border-radius:50%;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-sub);font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:all .14s}
.mc:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-soft)}
.fsec{background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:18px;margin-bottom:12px}
.fst{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-sub);margin-bottom:13px;display:flex;align-items:center;gap:7px}
.fst::after{content:'';flex:1;height:1px;background:var(--border)}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.fg:last-child{margin-bottom:0}
.fl{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-sub)}
.fi,.fs,.ft{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 13px;border-radius:var(--rx-sm);font-family:'Figtree',sans-serif;font-size:.9rem;transition:border-color .14s,box-shadow .14s;width:100%;outline:none}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ft{resize:vertical;min-height:86px}
.fs option{background:var(--surface);color:var(--text)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:460px){.f2{grid-template-columns:1fr}}
.cl-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cl-count{margin-left:auto;font-size:.78rem;color:var(--text-sub);white-space:nowrap}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:stretch}
.cl-card{position:relative;display:flex;flex-direction:column;gap:9px;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:13px 14px 11px;cursor:pointer;transition:border-color .14s,background .14s}
.cl-card.is-prospect{border-color:var(--success)}
.cl-card.is-resiliated{border-color:var(--danger)}
.cl-card:hover{border-color:var(--border-hi);background:var(--card-hi)}
.cl-card.sel{border-color:var(--accent);background:var(--accent-soft)}
.cl-card-top{display:flex;align-items:center;gap:10px;min-width:0}
.cl-card-id{flex:1;min-width:0}
.cl-card-name{font-weight:600;font-size:.92rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cl-card-loc{font-size:.76rem;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cl-card-act{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .14s}
.cl-card:hover .cl-card-act,.cl-card:focus-within .cl-card-act{opacity:1}
@media(hover:none){.cl-card-act{opacity:1}}
.cl-card-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.72rem}
.cl-card-badges .group-tag,.cl-card-badges .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cl-card-ct{font-size:.8rem;min-width:0}
.cl-ct-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-ct-role{color:var(--text-sub)}
.cl-ct-links{display:flex;gap:4px 12px;flex-wrap:wrap;margin-top:3px;font-size:.76rem}
.cl-ct-links a{color:var(--text-sub);text-decoration:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-ct-links a:hover{color:var(--accent);text-decoration:underline}
.cl-card-ids{font-size:.74rem;color:var(--text-sub);line-height:1.5}
.cl-card-ids b{color:var(--text);font-weight:600}
.cl-card-ids b.eff-alert{color:var(--danger);font-weight:700}
.cl-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:9px;border-top:1px solid var(--border);font-size:.76rem;color:var(--text-sub)}
.cl-card-foot b{color:var(--text)}
.cl-muted{color:var(--text-sub);opacity:.7}
.cl-late{color:var(--danger);font-weight:700}
.cl-search-wrap{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:var(--rx-sm);padding:9px 14px;flex:0 1 280px;min-width:200px;transition:border-color .15s,box-shadow .15s}
.cl-search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cl-search-inp{background:transparent;border:none;color:var(--text);font-family:'Figtree',sans-serif;font-size:.88rem;outline:none;flex:1;min-width:0}
.cl-search-inp::placeholder{color:var(--text-sub)}
.cl-filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.cl-filter-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:22px;font-family:'Figtree',sans-serif;font-size:.86rem;font-weight:500;cursor:pointer;outline:none;transition:border-color .14s;appearance:none;-webkit-appearance:none}
.cl-filter-select:focus,.cl-filter-select.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cl-sort-select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:20px;font-family:'Figtree',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;outline:none}
.cl-filter-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);cursor:pointer}
.cl-filter-tag:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.cl-check{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:14px}
.bulk-bar{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);border-radius:var(--rx);padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 8px 32px var(--accent-glow);z-index:50;}
.bulk-count{font-weight:700;font-size:.88rem;color:var(--accent);white-space:nowrap}
.bulk-sep{width:1px;height:20px;background:var(--border)}
.cl-select-row{display:flex;align-items:center;gap:10px;padding:8px 17px;font-size:.8rem;color:var(--text-sub);cursor:pointer;user-select:none}
.cl-select-row:hover{color:var(--text)}
.cl-results{font-size:.78rem;color:var(--text-sub);padding:2px 0}
.cl-hero{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--rx);padding:24px 140px 24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:18px 14px;margin-bottom:22px}
.cld-del{position:absolute;top:24px;right:26px}
.cld-id{grid-column:1;grid-row:1}
.cld-actions{grid-column:2;grid-row:1;justify-self:end;align-self:start}
.cl-av{width:60px;height:60px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:#fff;flex-shrink:0}
.cld-id{display:flex;align-items:flex-start;gap:16px;min-width:0}
.cl-cn{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
.cl-ca{color:var(--text-sub);font-size:.88rem;line-height:1.6}
.cld-badges{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.cld-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cld-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;background:var(--card-hi);border:1px solid var(--border);font-size:.76rem;color:var(--text-sub);white-space:nowrap}
.cld-chip b{color:var(--text);font-weight:600}

function xlsEnc(v){

function xlsDec(v){

function parseXlsWorkbook(wb){

  const dec=list=>list.filter(r=>Object.values(r).some(v=>v!=='')).map(r=>{
    const o={};

      let v=xlsDec(r[k]);
      if(XLS_NUM.includes(k))v=(v===''||v===null)?null:Number(v);
      if(k==='zip'&&typeof v==='number')v=String(v).padStart(5,'0');
      if(k==='saas'){if(v===''||v==null)return;v=(v===true||v===1||/^(true|1|oui|x)$/i.test(String(v)));}
      if(XLS_BOOL.includes(k))v=(v===true||v==='true'||v==='TRUE'||v===1);
      o[k]=v;
    });

  });
  // Restaure les champs non stockés dans Excel (pièces jointes, logos trop lourds) depuis les données locales
  const restore=(list,old)=>{
    const byId={};(old||[]).forEach(x=>{if(x&&x.id)byId[x.id]=x});
    list.forEach(it=>{
      const o=byId[it.id];if(!o)return;
      Object.keys(o).forEach(k=>{

        if(XLS_SKIP.includes(k)||(typeof ov==='string'&&ov.length>XLS_MAXCELL))it[k]=o[k];
      });
    });
    return list;
  };
  const clients=restore(dec(get('Clients')),S.clients);
  const offers=[]; // offres : non utilisées sur mobile
  const todos=restore(dec(get('Taches')),S.todos);
  const invoices=[]; // factures : non utilisées sur mobile

function logoDraw(img,max,whiteBg){
  const nw=img.naturalWidth||img.width||256,nh=img.naturalHeight||img.height||256; // SVG sans dimensions : 256
  const ratio=Math.min(max/nw,max/nh,1),w=Math.max(1,Math.round(nw*ratio)),h=Math.max(1,Math.round(nh*ratio));

  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
  cx.drawImage(img,0,0,w,h);
  return cv;
}
function logoHasAlpha(cv){

async function logoEncode(img){ // image décodée → PNG (transparence conservée) ou JPEG, sous la limite de la sauvegarde Excel

  // 1) PNG (transparence conservée) : taille réduite jusqu'à passer sous la limite de la sauvegarde Excel
  for(const s of sizes){const u=logoDraw(img,s,false).toDataURL('image/png');if(u.length<=LOGO_MAX_CHARS)return u}

function sbarRows(items,colorFn,clickFn,multi,total){ // items : [[label,count], ...] ; clickFn(label) -> code JS au clic ; multi : colonnes ; total : base du pourcentage (nb de clients ou de contrats)
  if(!items||!items.length)return `<div class="p-empty">Aucune donnée</div>`;
  const base=total>0?total:Math.max(1,...items.map(i=>i[1]));
  const rows=items.map(([label,count])=>{
    const click=clickFn?clickFn(label):'';
    const pct=Math.min(100,count/base*100);
    const tip=(total>0?`${count} sur ${total} (${Math.round(pct)} %)`:'')+(click?(total>0?' · ':'')+'Voir les clients concernés':'');
    return `<div class="sbar-row"${click?` onclick="${click}" style="cursor:pointer"`:''}${tip?` title="${tip}"`:''}${multi&&!count?' data-zero="1"':''}><div class="sbar-lbl" title="${esc(String(label))}">${esc(String(label))}</div><div class="sbar-track"><div class="sbar-fill" style="width:${pct.toFixed(1)}%;background:${colorFn?colorFn(label):'var(--accent)'}"></div></div><div class="sbar-val" data-n="${count}"${total>0?` data-p="${pct.toFixed(3)}"`:''}>${count}</div></div>`;
  }).join('');
  return `<div class="${multi?'sbar-multi':'sbar-list'}">${rows}</div>`;
}

const rtFmtDur=s=>{const m=Math.max(0,Math.round(s/60)),h=Math.floor(m/60);return h?`${h} h ${String(m%60).padStart(2,'0')}`:`${m} min`};

  if(delay<120||ratio<1.10)return{lbl:'Fluide',col:'var(--success)'};
  if(ratio<1.30)return{lbl:'Dense',col:'var(--warning)'};
  if(ratio<1.60)return{lbl:'Très dense',col:'var(--danger)'};
  return{lbl:'Embouteillé',col:'var(--danger)'};
}

async function rtFetchTomTom(o,d,key){
  const u=`https://api.tomtom.com/routing/1/calculateRoute/${o.lat},${o.lon}:${d.lat},${d.lon}/json?key=${encodeURIComponent(key)}&traffic=true&travelMode=car&routeType=fastest&computeTravelTimeFor=all&sectionType=traffic&instructionsType=text&language=fr-FR`;
  const r=await fetch(u);
  if(r.status===401||r.status===403)throw new Error('KEY');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();const rt=j&&j.routes&&j.routes[0];if(!rt)throw new Error('NOROUTE');
  const sm=rt.summary||{};
  const pts=[];(rt.legs||[]).forEach(l=>(l.points||[]).forEach(p=>pts.push([p.latitude,p.longitude])));
  const total=sm.travelTimeInSeconds||0;
  const base=sm.noTrafficTravelTimeInSeconds||(total-(sm.trafficDelayInSeconds||0));
  const secs=(rt.sections||[]).filter(s=>String(s.sectionType).toUpperCase()==='TRAFFIC');
  const steps=((rt.guidance&&rt.guidance.instructions)||[]).filter(i=>i.message).map(i=>i.message);
  return{provider:'tomtom',pts,dist:sm.lengthInMeters||0,total,base,delay:Math.max(0,total-base),secs,steps};
}
async function rtFetchOsrm(o,d){
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${o.lon},${o.lat};${d.lon},${d.lat}?overview=full&geometries=geojson&steps=true`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();const rt=j&&j.routes&&j.routes[0];if(!rt)throw new Error('NOROUTE');
  const pts=((rt.geometry&&rt.geometry.coordinates)||[]).map(c=>[c[1],c[0]]);
  const MOD={left:'à gauche','slight left':'légèrement à gauche','sharp left':'franchement à gauche',right:'à droite','slight right':'légèrement à droite','sharp right':'franchement à droite',straight:'tout droit',uturn:'demi-tour'};
  const VERB={turn:'Tourner','end of road':'Tourner',fork:'Prendre la bifurcation','on ramp':'Prendre la bretelle','off ramp':'Prendre la sortie',merge:'Se rabattre'};
  const steps=[];
  (rt.legs||[]).forEach(l=>(l.steps||[]).forEach(s=>{
    const m=s.maneuver||{},nm=s.name?` sur ${s.name}`:'';
    if(m.type==='depart')steps.push(`Partir${nm}`);
    else if(m.type==='arrive')steps.push('Arrivée à destination');
    else if(m.type==='roundabout'||m.type==='rotary')steps.push(`Au rond-point, prendre la sortie${nm}`);
    else steps.push(`${VERB[m.type]||'Continuer'}${m.modifier&&MOD[m.modifier]?' '+MOD[m.modifier]:''}${nm}`);
  }));

const RT_CAT={0:['Perturbation','⚠'],1:['Accident','💥'],2:['Brouillard','🌫'],3:['Conditions dangereuses','⚠'],4:['Pluie','🌧'],5:['Verglas','🧊'],6:['Bouchon','🚗'],7:['Voie fermée','⛔'],8:['Route fermée / déviation','⛔'],9:['Travaux','🚧'],10:['Vent','💨'],11:['Inondation','🌊'],14:['Véhicule en panne','🛠']};
async function rtFetchIncidents(pts,key){ // incidents TomTom situés à moins de 150 m du trajet (zones < ~7 000 km², 6 requêtes max)
  const chunks=[];let cur=null;
  pts.forEach(p=>{
    if(!cur||Math.max(cur.maxLat,p[0])-Math.min(cur.minLat,p[0])>0.8||Math.max(cur.maxLon,p[1])-Math.min(cur.minLon,p[1])>1.0){cur={minLat:p[0],maxLat:p[0],minLon:p[1],maxLon:p[1]};chunks.push(cur)}
    else{cur.minLat=Math.min(cur.minLat,p[0]);cur.maxLat=Math.max(cur.maxLat,p[0]);cur.minLon=Math.min(cur.minLon,p[1]);cur.maxLon=Math.max(cur.maxLon,p[1])}
  });
  const fields='{incidents{type,geometry{type,coordinates},properties{id,iconCategory,magnitudeOfDelay,events{description,code,iconCategory},startTime,endTime,from,to,length,delay,roadNumbers}}}';
  const seen=new Map();let okOnce=false;
  for(const c of chunks.slice(0,6)){
    const pad=0.01;
    const u=`https://api.tomtom.com/traffic/services/5/incidentDetails?key=${encodeURIComponent(key)}&bbox=${(c.minLon-pad).toFixed(5)},${(c.minLat-pad).toFixed(5)},${(c.maxLon+pad).toFixed(5)},${(c.maxLat+pad).toFixed(5)}&fields=${encodeURIComponent(fields)}&language=fr-FR&timeValidityFilter=present`;
    const r=await fetch(u);if(!r.ok)continue;
    okOnce=true;
    const j=await r.json();

  }

    const samples=[];const step=Math.max(1,Math.floor(raw.length/5));
    for(let i=0;i<raw.length;i+=step)samples.push([raw[i][1],raw[i][0]]);
    const hit=samples.find(s=>rtNear(s,pts,150));
    if(!hit)return;
    const ev=(pr.events||[]);
    const cat=pr.iconCategory!=null?pr.iconCategory:(ev[0]&&ev[0].iconCategory)||0;
    out.push({source:'incident',cat,pt:hit,samples,mg:pr.magnitudeOfDelay||0,delay:pr.delay||0,
      desc:ev.map(e=>e.description).filter(Boolean).join(' · '),road:[pr.roadNumbers&&pr.roadNumbers.join(', '),[pr.from,pr.to].filter(Boolean).join(' → ')].filter(Boolean).join(' — ')});
  });
  return out;
}
function rtBuildAlerts(rt,incidents){
  const out=[];
  const secInfo=rt.secs.map(s=>{const seg=rt.pts.slice(s.startPointIndex,s.endPointIndex+1);return{s,seg,mid:seg[Math.floor(seg.length/2)]||null,cat:String(s.simpleCategory||'').toUpperCase()}});
  const incNearSeg=(i,seg)=>(i.samples||[i.pt]).some(s=>rtNear(s,seg,500)); // l'incident touche ce tronçon du trajet
  incidents.forEach(i=>{
    if(i.cat===6&&secInfo.some(x=>x.cat==='JAM'&&incNearSeg(i,x.seg)))return; // le ralentissement est déjà décrit (durée, vitesse) par le trajet
    const [lbl,ico]=RT_CAT[i.cat]||RT_CAT[0];
    out.push({ico,lbl,desc:i.desc,road:i.road,delay:i.delay,sev:Math.max(i.mg,[1,7,8].includes(i.cat)?2:0),pt:i.pt});
  });
  secInfo.forEach(x=>{
    if(x.cat==='JAM'){
      const d=x.s.delayInSeconds||0;if(d<60&&(x.s.magnitudeOfDelay||0)<2)return;
      out.push({ico:'🚗',lbl:'Ralentissement',desc:`${rtFmtKm(x.seg.length>1?x.seg.slice(1).reduce((a,p,i)=>a+rtDistM(x.seg[i],p),0):0)} à environ ${Math.round(x.s.effectiveSpeedInKmh||0)} km/h`,road:'',delay:d,sev:x.s.magnitudeOfDelay||1,pt:x.mid});
    }else if((x.cat==='ROAD_WORK'||x.cat==='ROAD_CLOSURE')&&x.mid&&!incidents.some(i=>incNearSeg(i,x.seg))){
      out.push({ico:x.cat==='ROAD_WORK'?'🚧':'⛔',lbl:x.cat==='ROAD_WORK'?'Travaux':'Route fermée / déviation',desc:'',road:'',delay:x.s.delayInSeconds||0,sev:x.cat==='ROAD_CLOSURE'?3:1,pt:x.mid});
    }
  });
  return out.sort((a,b)=>b.sev-a.sev||b.delay-a.delay);
}

function rtGetPosition(){ // position réelle de l'appareil (le navigateur demande l'autorisation)

    navigator.geolocation.getCurrentPosition(

      e=>rej(new Error(e&&e.code===1?'DENIED':e&&e.code===3?'TIMEOUT':'UNAVAILABLE')),
      {enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  });

function licThresholdPct(total){return total>200?98:95}

function relanceState(c,cfg){ // référence = dernière relance traitée (alerte supprimée), sinon création du client / mise en service de la fonction
  const every=Math.max(1,parseInt(cfg.every)||1);

function computeNotifs(clientId,raw){ // clientId : limiter à un client ; raw : sans retirer les éléments supprimés
  const dis=S.settings.notifDismissed||{};
  const lim=new Date();lim.setFullYear(lim.getFullYear()-3);const limit=lim.toISOString().slice(0,10);
  const out=[];
  (S.clients||[]).forEach(c=>{
    if(clientId&&c.id!==clientId)return;
    const lic=parseLicences(c.effectif);
    if(lic&&lic.total>0&&lic.used*100>=licThresholdPct(lic.total)*lic.total){
      out.push({key:`lic:${c.id}:${lic.used}/${lic.total}`,level:'alerte',type:'licences',clientId:c.id,
        text:lic.used>=lic.total?`Licences salariés ${lic.used>lic.total?'dépassées':'atteintes'} : ${lic.used} / ${lic.total}`:`Licences salariés presque pleines : ${lic.used} / ${lic.total} (${Math.round(lic.used/lic.total*100)} %)`});
    }
    const vmin=verParse(S.settings.versionMin||'5.1'),vcl=verParse(c.version);
    if(vmin&&vcl&&verLess(vcl,vmin))out.push({key:`version:${c.id}:${c.version}`,level:'alerte',type:'version',clientId:c.id,
      text:`Version obsolète : ${c.version} (inférieure à la ${vmin[0]}.${vmin[1]})`});
    const cfg=(S.settings.autoTasks||{})[c.priority];
    if(cfg&&cfg.on){
      const st=relanceState(c,cfg);
      if(st.due)out.push({key:'relance:'+c.id,level:'alerte',type:'relance',clientId:c.id,
        text:`À relancer : ${st.elapsed} jour${st.elapsed>1?'s':''} sans relance (relance tous les ${cfg.every} ${cfg.unit==='months'?'mois':'jours'})`});
    }
    const old=(c.contracts||[]).filter(ct=>ctEtat(ct)==='active'&&ct.dateSignature&&ct.dateSignature<limit).sort((a,b)=>a.dateSignature.localeCompare(b.dateSignature));
    if(old.length)out.push({key:'contrat:'+c.id,level:'notif',type:'contrat',clientId:c.id,
      text:`Contrat de plus de 3 ans : « ${old[0].label||'Contrat'} » signé le ${fd(old[0].dateSignature)}${old.length>1?` (+${old.length-1} autre${old.length>2?'s':''})`:''}`});
  });
  const nm=id=>((S.clients||[]).find(x=>x.id===id)||{}).company||'';
  const list=raw?out:out.filter(n=>n.type==='relance'||!dis[n.key]); // une relance se « traite » en la supprimant : son délai repart de zéro
  return list.sort((a,b)=>(a.level==='alerte'?0:1)-(b.level==='alerte'?0:1)||nm(a.clientId).localeCompare(nm(b.clientId),'fr'));

  }
  if(!ctrActiveId||!list.some(x=>x.id===ctrActiveId))ctrActiveId=list[0].id;

function ctr_save(clientId,contractId){
  const c=S.clients.find(x=>x.id===clientId);if(!c)return;
  const label=document.getElementById('ctr-label').value.trim();
  if(!label){alert('Le libellé du contrat est obligatoire');return}
  const dDeb=document.getElementById('ctr-ddeb').value,dFin=document.getElementById('ctr-dfin').value,lyr=document.getElementById('ctr-loyer').value;
 if(lyr!==''&&impMoney(lyr)===null){alert('Le loyer mensuel doit être un montant positif');return}
 if(dDeb&&dFin&&dFin<dDeb){alert('La date de fin de contrat ne peut pas être antérieure à la date de début');return}
 const data={label,hebergeur:hebNorm(document.getElementById('ctr-heb').value),type:document.getElementById('ctr-type').value,dateSignature:document.getElementById('ctr-dsig').value,dateDebut:dDeb,dateFin:dFin,systeme:sysClean(document.getElementById('ctr-sys').value),loyerAnnuel:impMoney(lyr)};
 if(!data.hebergeur&&clIsOnPrem(c))data.hebergeur=HEB_ONPREM; // client OnPremise : hébergeur vide → « OnPremise »
 const etat=document.getElementById('ctr-etat').value;data.etat=etat;data.resilie=etat==='resilie'; // « resilie » reste synchronisé (exports, anciennes données)
 const prev=contractId?(c.contracts||[]).find(x=>x.id===contractId):null;
 if(!prev||!prev.statut||ctEtatFromText(prev.statut))data.statut=ctEtatLabel(etat); // un texte de statut importé non reconnu est conservé
  if(!c.contracts)c.contracts=[];
  if(contractId){
    const i=c.contracts.findIndex(x=>x.id===contractId);
    if(i>=0)c.contracts[i]={...c.contracts[i],...data};
  }else{
    const nc={id:uid(),...data};
    c.contracts.push(nc);
    ctrActiveId=nc.id;
  }
  save();cm();
  if(CV==='client-detail')navigate('client-detail',{id:clientId});
  if(CV==='clients')rClients();
  toast('Contrat enregistré ✓');
}

  toast('Contrat supprimé');
}

function impClean(s){return String(s==null?'':s).replace(/[\s\u00a0\u2007\u202f\u200b]+/g,' ').trim()}
function finopsOrEmpty(v){ // un FinOps à 0 (ou uniquement des 0) veut dire « pas de compte » -> champ vide (client = prospect)
  const s=String(v==null?'':v).trim();

function impDateOk(y,m,d){const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d}
function impDateStr(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return isNaN(v)?'':`${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'&&isFinite(v)){ // numéro de série Excel (jours depuis 1899-12-30)
    const d=new Date(Math.round((v-25569)*86400000));
    if(isNaN(d))return '';
    return d.toISOString().slice(0,10);
  }
  const s=impClean(v),P=n=>String(n).padStart(2,'0');

    }

  mapList().forEach(c=>{if(c.lat&&c.lon){mapAddClient(c);bounds.push([c.lat,c.lon])}});

function zipDept(z){
  z=String(z||'');if(!/^\d{5}$/.test(z))return'';
  if(z.startsWith('97'))return z.slice(0,3);
  if(z.startsWith('98'))return'';
  if(z.startsWith('20'))return +z<20200?'2A':'2B';
  return z.slice(0,2);
}
function geoCityKey(s){
  return impNorm(String(s||'').replace(/\bcedex\b.*$/i,'').replace(/\s+\d{1,2}(er|e|eme)?\s*$/i,'').replace(/\bst\b/ig,'saint').replace(/\bste\b/ig,'sainte'));
}
function geoCityMatch(a,b){a=geoCityKey(a);b=geoCityKey(b);return a.length>=3&&b.length>=3&&(a===b||a.includes(b)||b.includes(a))}
async function geoBAN(step,dept,city){
  if(step.q.length<3)return null;
  const u=new URL('https://data.geopf.fr/geocodage/search');
  u.searchParams.set('q',step.q);u.searchParams.set('limit','5');
  if(step.postcode)u.searchParams.set('postcode',step.postcode);
  if(step.type)u.searchParams.set('type',step.type);
  const r=await fetch(u.toString());
  if(r.status===400)return null;              // requête inexploitable : pas de résultat
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  const feats=((j&&j.features)||[]).filter(f=>f&&f.geometry&&f.geometry.coordinates&&f.properties&&(f.properties.score||0)>=0.4);
  const inDept=f=>!dept||String(f.properties.context||'').split(',')[0].trim().toUpperCase()===dept;
  const good=feats.filter(inDept);   // un homonyme situé dans un autre département est écarté
  const best=(city&&good.find(f=>geoCityMatch(f.properties.city,city)||geoCityMatch(f.properties.district,city)))||good[0];
  if(!best)return null;
  const t=best.properties.type;
  return{lat:best.geometry.coordinates[1],lon:best.geometry.coordinates[0],kind:(t==='housenumber'||t==='street')?'adresse':'ville'};
}
async function geoNominatim(step,dept,city){
  const wait=1100-(Date.now()-geoLastFetch); // Nominatim : 1 requête / seconde
  if(wait>0)await new Promise(r=>setTimeout(r,wait));
  geoLastFetch=Date.now();
  const q=[step.q,step.postcode&&!step.q.includes(step.postcode)?step.postcode:''].filter(Boolean).join(' ')+', France';
  const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=json&limit=5&addressdetails=1&countrycodes=fr&accept-language=fr');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const data=await r.json();
  const inDept=x=>{
    if(!dept)return true;
    const a=x.address||{},iso=a['ISO3166-2-lvl6'];
    if(iso)return String(iso).toUpperCase()==='FR-'+dept;
    if(a.postcode)return zipDept(String(a.postcode).slice(0,5))===dept;
    return false;   // impossible de vérifier : écarté
  };
  const best=(data||[]).filter(inDept)[0];
  if(!best)return null;
  return{lat:parseFloat(best.lat),lon:parseFloat(best.lon),kind:step.level};
}
async function geoSearch(step,dept,city){
  const key=JSON.stringify([step.q,step.postcode,step.type,dept]).toLowerCase();
  if(key in geoCache)return geoCache[key]||null;
  let res=null;
  try{res=await geoBAN(step,dept,city)}
  catch(e){res=await geoNominatim(step,dept,city)}   // service officiel injoignable : secours ; si lui aussi échoue, l'erreur remonte
  geoCache[key]=res||0;
  try{mstore.setItem(GEO_KEY,JSON.stringify(geoCache))}catch(e){}
  return res;
}
async function geoLocate(c){
  const p=clAddrParts(c);
  const dept=zipDept(p.zip);
  const cedex=/\bCEDEX\b/i.test(p.city);
  const city=String(p.city||'').replace(/\s*\bCEDEX\b\s*\d*\s*$/i,'').trim()||p.city;
  const zipOk=p.zip&&!cedex;   // un code CEDEX est un code de distribution du courrier, pas un code géographique : il ne sert pas de filtre
  const steps=[];
  const add=s=>{if(s.q&&!steps.some(x=>x.q===s.q&&x.postcode===s.postcode&&x.type===s.type))steps.push(s)};
  if(p.street)add({level:'adresse',q:[p.street,zipOk?p.zip:'',city].filter(Boolean).join(' '),postcode:zipOk?p.zip:'',type:''});
  if(city){add({level:'ville',q:city,postcode:zipOk?p.zip:'',type:'municipality'});add({level:'ville',q:city,postcode:'',type:'municipality'})}
  if(zipOk)add({level:'cp',q:city||p.zip,postcode:p.zip,type:'municipality'});
  for(const s of steps){
    const r=await geoSearch(s,dept,city);
    if(r)return{lat:r.lat,lon:r.lon,level:s.level==='adresse'?r.kind:s.level};
  }
  return null;
}

  });

async function geoNext(){
  if(geoQueue.length===0){
    geoRunning=false;save();
    toast(geoFailed?'Localisation interrompue (connexion ?)':'Positions mises à jour ✓');
    if(clMapActive())mapAfterGeo();
    return;
  }
  geoRunning=true;
  const id=geoQueue.shift();
  const c=S.clients.find(x=>x.id===id);
  if(c){
    try{
      const found=await geoLocate(c);
      if(found){c.lat=found.lat;c.lon=found.lon;c.geoLevel=found.level;if(clMapActive())mapAddClient(c)}
      else{c.lat=0;c.lon=0;c.geoLevel='';if(clMapActive())mapRemoveClient(c.id)}   // introuvable : ne sera pas réessayé automatiquement

    }

    const info=document.getElementById('map-info');if(info)info.innerHTML=mapInfoText();
    if(geoQueue.length%10===0)save();
  }

}

async function cldPhotoChosen(id,inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const c=S.clients.find(x=>x.id===id);if(!c)return;
  if(f.size>5*1024*1024){toast('Image trop grande (max 5 Mo)');inp.value='';return}

  const had=!!c.logo;c.logo=data;save();cm();cldPhotoRefresh(id);

function cldPhotoPng(src){ // image du client → PNG (le presse-papiers n'accepte que le PNG) ; transparence conservée
  return new Promise((res,rej)=>{
    const img=new Image();if(!/^data:/i.test(src))img.crossOrigin='anonymous';
    img.onload=()=>{try{
      const w=img.naturalWidth||256,hh=img.naturalHeight||256,k=Math.min(1,2048/Math.max(w,hh)),cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(hh*k));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(b=>b?res(b):rej(new Error('png')),'image/png');
    }catch(e){rej(e)}};
    img.onerror=()=>rej(new Error('load'));img.src=src;
  });
}
async function cldPhotoCopy(id){
  const c=S.clients.find(x=>x.id===id);if(!c||!c.logo)return;
  try{
    if(!navigator.clipboard||typeof ClipboardItem==='undefined')throw new Error('clip');
    await navigator.clipboard.write([new ClipboardItem({'image/png':cldPhotoPng(c.logo)})]); // promesse : le geste de l'utilisateur est conservé
    toast('📋 Image de « '+(c.company||'client')+' » copiée');
  }catch(e){
    if(/^https?:/i.test(c.logo)){try{await navigator.clipboard.writeText(c.logo);toast('Image externe protégée : son adresse a été copiée à la place');return}catch(e2){}}
    toast('Copie de l\'image impossible dans ce navigateur');
  }
}

function mobConfirm(title,msg,fn){
  om(`<div class="mh"><h2 class="mt">${esc(title)}</h2><button class="mc" onclick="cm()">✕</button></div><p style="color:var(--text-sub);line-height:1.5;margin:4px 0 20px">${msg}</p><div style="display:flex;gap:10px"><button type="button" class="btn btn-d" style="flex:1;justify-content:center" id="m-conf-ok">🗑 Supprimer</button><button type="button" class="btn btn-g" style="flex:1;justify-content:center" onclick="cm()">Annuler</button></div>`);
  document.getElementById('m-conf-ok').onclick=()=>{cm();fn()};
}
(function(){
  const wrap=(name,info)=>{const orig=window[name];if(typeof orig!=='function')return;
    window[name]=function(){const a=arguments;if(!mobOn())return orig.apply(this,a); // PC : boîte de confirmation d'origine, inchangée
      const t=info.apply(null,a);
      mobConfirm(t[0],t[1],()=>{const nc=window.confirm;window.confirm=()=>true;try{orig.apply(null,a)}finally{window.confirm=nc}});};};
  wrap('del',(type,id)=>{const c=type==='client'?S.clients.find(x=>x.id===id):null;return type==='client'?['Supprimer ce client ?',`<strong>${esc(c?c.company:'Ce client')}</strong> et toutes ses données (contacts, contrats, modules, notes) seront supprimés. Cette action est définitive.`]:['Confirmer la suppression','Cet élément sera supprimé définitivement.']});
  wrap('ctDelete',(cid,i)=>{const c=S.clients.find(x=>x.id===cid),ct=c&&c.contacts&&c.contacts[i];return['Supprimer ce contact ?',`<strong>${esc(ct?(ctFullName(ct)||ct.email||'Sans nom'):'Ce contact')}</strong> sera supprimé de la fiche.`]});
  wrap('ctr_delete',()=>['Supprimer ce contrat ?','Ce contrat sera supprimé définitivement de la fiche du client.']);
})();

}
